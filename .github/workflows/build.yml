name: Native macOS Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Xcode project
        run: xcodebuild -project Vanille.xcodeproj -scheme Vanille -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: DSP and buffer safety checks
        run: ./Scripts/test.sh
      - name: Standalone app bundle
        run: ./Scripts/build.sh
      - name: Experimental bridge checks
        run: ./Scripts/test-airplay-bridge.sh
      - name: A/V clock analysis checks
        run: ./Scripts/test-avsync.sh
      - name: Independent capture and render checks
        run: zsh Scripts/test-bridge-render.sh
      - name: Experimental native AirPlay bridge
        run: ./Scripts/build-airplay-bridge-lab.sh
      - name: Isolated AudioServerPlugIn ABI and clock checks
        run: zsh Scripts/test-latency-driver.sh
